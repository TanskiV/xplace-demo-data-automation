[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xplace-demo-data-automation"
version = "0.1.0"
description = "Reference CSV/Excel cleaning and validation utility"
requires-python = ">=3.10"

[project.optional-dependencies]
excel = ["openpyxl>=3.1,<4"]
test = ["pytest>=8,<9"]

[project.scripts]
data-automation = "data_automation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
